<!doctype html><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>body{margin:0}.og{width:1200px;height:630px;background:#f4efe6;position:relative;overflow:hidden;font-family:'Cormorant Garamond',Georgia,serif;color:#061030}
.weave{position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,rgba(6,16,48,.05) 0 1px,transparent 1px 7px),repeating-linear-gradient(90deg,rgba(6,16,48,.05) 0 1px,transparent 1px 7px)}
.rule{position:absolute;left:72px;right:72px;top:72px;border-top:1px solid #cfc5b1}
.rule2{position:absolute;left:72px;right:72px;bottom:72px;border-top:1px solid #cfc5b1}
.logo{position:absolute;left:72px;top:104px;height:92px}
.h{position:absolute;left:72px;top:250px;font-size:74px;line-height:1.02;font-weight:500;letter-spacing:-.01em;width:820px}
.h em{color:#0030e8;font-style:italic}
.m{position:absolute;left:72px;bottom:96px;font-family:'IBM Plex Mono',monospace;font-size:16px;letter-spacing:.28em;text-transform:uppercase;color:#5b6078}
.sw{position:absolute;right:72px;top:104px;width:240px;height:360px;background:url(../public/fabrics/percale.webp) center/cover;box-shadow:inset 0 0 0 1px rgba(6,16,48,.1)}
.sw2{position:absolute;right:120px;top:170px;width:240px;height:330px;background:url(../public/fabrics/terry.webp) center/cover;box-shadow:inset 0 0 0 1px rgba(6,16,48,.1)}
.cover{width:1128px;height:191px}
.cover .h{top:40px;left:48px;font-size:44px;width:760px}.cover .logo{display:none}.cover .m{left:48px;bottom:30px;font-size:12px}.cover .rule,.cover .rule2{display:none}.cover .sw{right:40px;top:0;width:150px;height:191px}.cover .sw2{right:170px;top:30px;width:150px;height:161px}
</style>
<script>const cover=location.search.includes('cover');</script>
<body><div class="og" id="og"><div class="weave"></div><div class="rule"></div><div class="rule2"></div>
<img class="logo" src="../public/brand/logo-blue.png"><div class="sw"></div><div class="sw2"></div>
<div class="h">Hotel linen, bedding &amp; towels, <em>woven in Pakistan.</em></div>
<div class="m">Export manufacturer · Faisalabad · Karachi · Sialkot · FOB Karachi</div></div>
<script>if(cover)document.getElementById('og').classList.add('cover')</script></body>
